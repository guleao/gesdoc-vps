<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Espelho dos portais</title>
<style>
@font-face { font-family: "Geist"; src: url(/fontes/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url(/fontes/GeistMono-Variable.woff2) format("woff2"); font-weight: 100 900; }
:root {
  --s0: #09090b; --s1: #0f0f12; --s2: #151518; --s3: #1c1c20; --s4: #26262b;
  --l1: rgba(255,255,255,.06); --l2: rgba(255,255,255,.1); --l3: rgba(255,255,255,.16);
  --t1: #ededef; --t2: #a0a0ab; --t3: #6c6c76; --t4: #4a4a52;
  --ac: #3ecf8e; --ac-fundo: rgba(62,207,142,.12); --ac-tinta: #04140c;
  --ok: #3ecf8e; --at: #f0a541; --er: #f0565a; --in: #6ea8fe;
  --r1: 5px; --r2: 7px; --r3: 10px;
  --ui: "Geist", "Segoe UI", system-ui, sans-serif; --mono: "Geist Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--s0); color: var(--t1); font: 13px/1.45 var(--ui); }
header { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px; border-bottom: 1px solid var(--l1); background: var(--s1); position: sticky; top: 0; z-index: 3; }
header h1 { font-size: 14px; font-weight: 600; margin: 0 8px 0 0; }
.seg { display: inline-flex; background: var(--s3); border-radius: var(--r2); padding: 2px; gap: 2px; }
.seg button { height: 24px; padding: 0 10px; border: 0; border-radius: var(--r1); background: none; color: var(--t2); font: inherit; cursor: pointer; }
.seg button.on { background: var(--s4); color: var(--t1); }
.seg button .n { font-family: var(--mono); font-size: 11.5px; color: var(--t3); margin-left: 6px; }
button.btn, a.btn { display: inline-flex; align-items: center; text-decoration: none; height: 28px; padding: 0 12px; border: 1px solid var(--l2); border-radius: var(--r2); background: var(--s3); color: var(--t1); font: inherit; cursor: pointer; }
button.btn:hover, a.btn:hover { background: var(--s4); }
.dir { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--t2); }
main { padding: 16px; max-width: 1700px; margin: 0 auto; }
.cartoes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.cartao { background: var(--s2); border: 1px solid var(--l1); border-radius: var(--r3); padding: 10px 14px; min-width: 190px; }
.cartao .rot { color: var(--t3); font-size: 11.5px; }
.cartao .val { font-family: var(--mono); font-size: 16px; margin-top: 2px; }
.cartao .sub { color: var(--t2); font-size: 12px; margin-top: 2px; }
.ok { color: var(--ok); } .at { color: var(--at); } .er { color: var(--er); } .fr { color: var(--t3); }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
.filtros select, .filtros input { height: 28px; background: var(--s3); color: var(--t1); border: 1px solid var(--l2); border-radius: var(--r2); padding: 0 8px; font: inherit; max-width: 260px; }
.filtros input[type=search] { width: 240px; }
.filtros label { color: var(--t2); display: inline-flex; align-items: center; gap: 6px; }
.contagem { color: var(--t2); margin-left: auto; font-family: var(--mono); font-size: 12px; }
.tabela { background: var(--s1); border: 1px solid var(--l1); border-radius: var(--r3); overflow: auto; max-height: calc(100vh - 290px); }
table { border-collapse: collapse; width: 100%; }
th { position: sticky; top: 0; background: var(--s2); color: var(--t2); font-weight: 500; text-align: left; font-size: 12px; padding: 7px 10px; border-bottom: 1px solid var(--l2); white-space: nowrap; cursor: pointer; user-select: none; }
th:hover { color: var(--t1); }
td { padding: 6px 10px; border-bottom: 1px solid var(--l1); vertical-align: top; }
tr:hover td { background: var(--s2); }
td.m { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
td.doc { max-width: 380px; }
.selo { display: inline-block; padding: 0 6px; border-radius: var(--r1); font-size: 11.5px; line-height: 18px; border: 1px solid var(--l2); color: var(--t2); white-space: nowrap; }
.selo.ok { color: var(--ok); border-color: rgba(62,207,142,.35); }
.selo.at { color: var(--at); border-color: rgba(240,165,65,.35); }
.selo.er { color: var(--er); border-color: rgba(240,86,90,.35); }
.selo.in { color: var(--in); border-color: rgba(110,168,254,.35); }
.cod { color: var(--t4); font-family: var(--mono); font-size: 11px; display: block; }
a { color: var(--in); text-decoration: none; } a:hover { text-decoration: underline; }
.nosso { color: var(--t2); font-size: 12px; max-width: 300px; }
.aviso { background: var(--s2); border: 1px solid rgba(240,165,65,.35); color: var(--at); border-radius: var(--r3); padding: 10px 14px; margin-bottom: 12px; }
.erro { border-color: rgba(240,86,90,.35); color: var(--er); }
.saiu td { color: var(--t3); text-decoration: line-through; }
h2 { font-size: 13px; font-weight: 600; margin: 20px 0 8px; }
.dica { color: var(--t3); font-size: 12px; }
tbody tr[data-i] { cursor: pointer; }
tbody tr.dia td { background: var(--s2); color: var(--t2); font-size: 12px; padding-top: 10px; }
#comoEnv { margin: 10px 0 0 8px; }
tr.sel td { background: var(--s4); }
/* Linguagem simples: situação em uma frase, próximo passo, ajuda da tela */
td.resumo { min-width: 220px; }
td.resumo .frase { font-weight: 500; display: block; }
td.resumo .sub { color: var(--t2); font-size: 12px; display: block; }
td a { white-space: nowrap; }
td.passo { color: var(--t1); font-size: 12.5px; max-width: 320px; }
td.passo .quem { display: block; color: var(--t3); font-size: 11.5px; margin-top: 2px; }
.ajuda { background: var(--s2); border: 1px solid var(--l1); border-radius: var(--r3); padding: 10px 14px; margin-bottom: 14px; color: var(--t2); line-height: 1.55; }
.ajuda summary { color: var(--t1); font-weight: 500; cursor: pointer; }
.ajuda p { margin: 8px 0 0; max-width: 980px; }
.ajuda b { color: var(--t1); font-weight: 500; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12px; }
.legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.legenda i.er { background: var(--er); } .legenda i.at { background: var(--at); } .legenda i.in { background: var(--in); } .legenda i.ok { background: var(--ok); }
td .frase { font-weight: 500; display: block; }
td .sub { color: var(--t2); font-size: 12px; display: block; }
td details summary { color: var(--in); cursor: pointer; }
ul.itens { margin: 4px 0 0; padding-left: 18px; color: var(--t2); font-size: 12px; }
ul.itens li { margin: 2px 0; }
.oque { color: var(--t2); margin: 10px 0 0; }
.oque b { color: var(--t1); font-weight: 500; }
/* Ficha da pendência (mesmo roteiro das fichas de 27/10) */
#ficha { position: fixed; top: 46px; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--s1); border-left: 1px solid var(--l2); overflow: auto; padding: 18px 20px 40px; transform: translateX(100%); transition: transform .15s; z-index: 4; }
#ficha.aberta { transform: none; }
#ficha .fechar { position: absolute; top: 12px; right: 14px; }
#ficha .num { color: var(--t3); font-size: 11.5px; font-family: var(--mono); }
#ficha h3 { font-size: 16px; font-weight: 600; margin: 4px 40px 4px 0; line-height: 1.3; }
#ficha .quem-e { color: var(--t2); margin-bottom: 14px; }
#ficha dl { margin: 0; }
#ficha dt { color: var(--t3); font-size: 11.5px; margin-top: 14px; }
#ficha dd { margin: 3px 0 0; color: var(--t1); font-size: 13px; line-height: 1.5; }
#ficha ol, #ficha ul { margin: 4px 0 0; padding-left: 20px; }
#ficha li { margin: 3px 0; }
#ficha .quem { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: var(--r1); background: var(--s3); color: var(--t2); font-size: 11.5px; }
#ficha .grupo { display: inline-block; margin-top: 6px; }
#ficha .manual { margin-top: 18px; padding: 12px 14px; background: var(--s2); border: 1px solid var(--l1); border-radius: var(--r3); }
#ficha .manual .tit { font-weight: 600; margin-bottom: 2px; }
#ficha .dados { margin-top: 18px; }
#ficha .dados summary { color: var(--t2); cursor: pointer; }
#ficha .dados table td { padding: 3px 8px 3px 0; border: 0; font-size: 12px; }
#ficha .dados table td:first-child { color: var(--t3); white-space: nowrap; }
#ficha .ressalva { color: var(--at); }
</style>
</head>
<body>
<header>
  <h1>O que os robôs viram nos sites</h1>
  <div class="seg" id="portal">
    <button data-p="atlas" class="on" title="Site do Atlas: documentos que a Equatorial pede">Atlas</button>
    <button data-p="bern" title="Site do Bernhoeft (ContractWeb): documentos dos contratos">Bernhoeft</button>
    <button data-p="hist" title="Tudo o que os robôs fizeram, do mais novo para o mais antigo">Histórico do robô</button>
  </div>
  <div class="dir">
    <span id="lido"></span>
    <a class="btn" href="/planilhas" title="Planilhas de uso intensivo assistido (ver e baixar)">Planilhas</a>
    <button class="btn" id="atualizar" title="Mostra a olhada mais recente do robô (não entra nos sites)">Atualizar</button>
  </div>
</header>
<main id="tela"><p class="fr">Carregando…</p></main>
<aside id="ficha"></aside>

<script src="/diag.js"></script>
<script>
// Situações com o nome que o próprio Atlas mostra.
const STATUS_ATLAS = {
  CriticalDelay: 'Crítico atrasado', Delay: 'Atrasado', DelayNotSent: 'Não enviado no prazo', DelayRejected: 'Reprovado (atrasado)',
  Pending: 'Pendente', PendingNotSent: 'Não enviado', PendingRejected: 'Reprovado (pendente)', WaitingForPredecessors: 'Aguardando predecessor(es)',
  ToValidate: 'Em análise', Valid: 'Aprovado', Expired: 'Vencido',
};
const corAtlas = (s) => /Rejected/.test(s) ? 'er' : /Delay/.test(s) ? 'at' : /Valid$/.test(s) ? 'ok' : /ToValidate|Waiting/.test(s) ? 'in' : '';
const corBern = (s) => /Não Entregue/i.test(s) ? 'er' : /Não Analisado/i.test(s) ? 'in' : /^Analisado/i.test(s) ? 'ok' : /reprov/i.test(s) ? 'er' : '';
// Situação do Bernhoeft dita de um jeito simples (o nome do site fica embaixo, em cinza).
const statusBernSimples = (s) => /Não Entregue/i.test(s) ? 'Falta entregar' : /Não Analisado/i.test(s) ? 'Entregue, esperando análise' : /^Analisado/i.test(s) ? 'Já analisado' : s;
const ABAS_ATLAS = ['Atrasados', 'Próximas entregas', 'Reprovados'];
// O que é cada aba, em uma frase (aparece logo abaixo das abas).
const OQUE_ATLAS = {
  Atrasados: '<b>Atrasados:</b> o prazo já passou e a Equatorial ainda não tem o documento certo. Os recusados também aparecem aqui quando o prazo deles já passou.',
  'Próximas entregas': '<b>Próximas entregas:</b> ainda está dentro do prazo. Precisa ser enviado até a data da coluna Prazo.',
  Reprovados: '<b>Reprovados:</b> a Equatorial abriu o arquivo enviado e recusou. Alguém precisa ler o motivo no site, apagar o arquivo recusado e mandar outro.',
  'Enviados por nós': '<b>Enviados por nós:</b> o que o nosso sistema já mandou para o site. "Robô" = saiu sozinho; "painel" = alguém clicou em Enviar.',
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const data = (s) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(s || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ''); };
const hora = (s) => s ? new Date(s).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const nomeLeitura = (arq) => hora(arq.replace('.json', '').replace(/T(\d\d)-(\d\d)-(\d\d)-(\d+)Z/, 'T$1:$2:$3.$4Z'));
const cpfMasc = (c) => !c ? '' : estado.verCpf ? c : String(c).replace(/^(\d{3})\.?(\d{3})\.?(\d{3})-?(\d{2})$/, '***.$2.$3-**');

const estado = { portal: 'atlas', atlas: null, bern: null, abaAtlas: 'Atrasados', statusBern: 'todos', f: {}, ordem: null, verCpf: false, antigaAtlas: null, antigaBern: null, como: 'robo', hist: null, histDias: 3, histRobo: 'todos', histTudo: false };

async function api(rota) {
  const r = await fetch(rota);
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || r.status);
  return j;
}

async function carregar(novo) {
  const tela = document.getElementById('tela');
  document.getElementById('lido').textContent = 'Lendo da VPS…';
  try {
    if (estado.portal === 'hist') estado.hist = await api('/api/historico?dias=' + estado.histDias);
    else if (estado.portal === 'atlas') estado.atlas = await api('/api/atlas' + (novo ? '?novo=1' : ''));
    else estado.bern = await api('/api/bern' + (novo ? '?novo=1' : ''));
    desenhar();
  } catch (e) {
    document.getElementById('lido').textContent = '';
    tela.innerHTML = `<div class="aviso erro">Não deu para ler da VPS: ${esc(e.message)}<br><span class="dica">Confira se o Tailscale está ligado. Se o tailscale ssh pedir para aprovar um link no navegador, aprove e clique em Atualizar.</span></div>`;
  }
}

function opcoes(lista, campo, rotulo) {
  const vals = [...new Set(lista.map((x) => x[campo]).filter((v) => v != null && v !== ''))].sort((a, b) => String(a).localeCompare(String(b), 'pt-BR', { numeric: true }));
  const sel = estado.f[campo] || '';
  return `<select data-f="${campo}"><option value="">${esc(rotulo)}: todos</option>${vals.map((v) => `<option ${String(v) === sel ? 'selected' : ''} value="${esc(v)}">${esc(campo === 'status' && STATUS_ATLAS[v] && estado.portal === 'atlas' ? STATUS_ATLAS[v] : v)}</option>`).join('')}</select>`;
}

function filtrar(lista, campos) {
  const busca = (estado.f.busca || '').toLowerCase();
  let r = lista.filter((x) => Object.entries(estado.f).every(([k, v]) => !v || k === 'busca' || k === 'comFunc' || String(x[k] ?? '') === v));
  if (estado.f.comFunc) r = r.filter((x) => x.funcionario || x.colaboradores);
  if (busca) r = r.filter((x) => campos.some((c) => String(x[c] ?? '').toLowerCase().includes(busca)) || (x.cpf && String(x.cpf).replace(/\D/g, '').includes(busca.replace(/\D/g, '') || '§')));
  if (estado.ordem) {
    const [c, dir] = estado.ordem;
    r = [...r].sort((a, b) => String(a[c] ?? '').localeCompare(String(b[c] ?? ''), 'pt-BR', { numeric: true }) * dir);
  }
  return r;
}

const th = (c, t) => `<th data-ord="${c}">${esc(t)}${estado.ordem?.[0] === c ? (estado.ordem[1] > 0 ? ' ↑' : ' ↓') : ''}</th>`;

// ---------- enviados (Atlas e Bernhoeft) ----------
// Separa o que o robô enviou sozinho (auto) do que saiu pelo botão do painel, e agrupa por dia para acompanhar.
const COMO_ENV = [['robo', 'Pelo robô (automático)'], ['painel', 'Pelo painel (à mão)'], ['todos', 'Todos']];
const doComo = (envs, c) => (c === 'todos' ? envs : envs.filter((e) => (c === 'robo') === Boolean(e.auto)));
const diaDe = (s) => new Date(s).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
const soHora = (s) => new Date(s).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
function haQuanto(s) {
  const m = Math.round((Date.now() - new Date(s)) / 60000);
  if (m < 60) return `há ${m} min`;
  if (m < 48 * 60) return `há ${Math.round(m / 60)} h`;
  return `há ${Math.round(m / 1440)} dias`;
}
function resumoEnvios(envs) {
  const robo = envs.filter((e) => e.auto), hoje = new Date().toDateString();
  const semana = robo.filter((e) => Date.now() - new Date(e.em) < 7 * 86400000).length;
  const ultimo = robo.reduce((u, e) => (!u || e.em > u ? e.em : u), '');
  return `<div class="cartoes">
    <div class="cartao"><div class="rot">Enviados pelo robô</div><div class="val">${robo.length}</div><div class="sub">${ultimo ? `último ${esc(hora(ultimo))} (${esc(haQuanto(ultimo))})` : 'nenhum ainda'}</div></div>
    <div class="cartao"><div class="rot">Pelo robô hoje</div><div class="val">${robo.filter((e) => new Date(e.em).toDateString() === hoje).length}</div><div class="sub">${semana} nos últimos 7 dias</div></div>
    <div class="cartao"><div class="rot">Pelo painel (à mão)</div><div class="val">${envs.length - robo.length}</div><div class="sub">botão Enviar do painel</div></div></div>`;
}
const segComo = (envs) => `<div class="seg" id="comoEnv">${COMO_ENV.map(([c, t]) => `<button data-como="${c}" class="${c === estado.como ? 'on' : ''}">${esc(t)}<span class="n">${doComo(envs, c).length}</span></button>`).join('')}</div>`;
// Linhas agrupadas por dia (a ordem de estado.vis é a mesma das linhas, para a ficha abrir certo).
function linhasPorDia(lista, ncol, linha) {
  let dia = '', out = '';
  lista.forEach((e, k) => {
    const d = diaDe(e.em);
    if (d !== dia) { dia = d; out += `<tr class="dia"><td colspan="${ncol}">${esc(d)} · ${lista.filter((x) => diaDe(x.em) === d).length} envio(s)</td></tr>`; }
    out += linha(e, k);
  });
  return out;
}
const celEnviado = (e) => `<td class="m">${esc(soHora(e.em))}<span class="cod">${esc(haQuanto(e.em))}</span></td><td>${e.auto ? '<span class="selo ok">robô</span>' : '<span class="selo in">painel</span>'}</td>`;

function desenhar() {
  fecharFicha();
  if (estado.portal === 'hist') desenharHist(); else if (estado.portal === 'atlas') desenharAtlas(); else desenharBern();
}

// ---------- Atlas ----------
function desenharAtlas() {
  const { coleta, nosso, painel_ok, leituras } = estado.atlas;
  const L = coleta.pendencias || [];
  document.getElementById('lido').textContent = `O robô olhou o Atlas pela última vez em ${hora(coleta.coletado_em)} (${haQuanto(coleta.coletado_em)})`;
  const tot = coleta.totais || {};

  // Comparação com uma leitura guardada antes.
  const ant = estado.antigaAtlas;
  const antIds = ant ? new Map(ant.pendencias.map((p) => [p.document_schedule_id + '|' + p.aba, p])) : null;
  const antSched = ant ? new Set(ant.pendencias.map((p) => p.document_schedule_id)) : null;
  const atuIds = new Set(L.map((p) => p.document_schedule_id + '|' + p.aba));
  const saiu = ant ? ant.pendencias.filter((p) => !atuIds.has(p.document_schedule_id + '|' + p.aba)) : [];

  const cartoes = ABAS_ATLAS.map((a) => {
    const n = L.filter((p) => p.aba === a).length;
    const igual = tot[a] == null || tot[a] === n;
    return `<div class="cartao"><div class="rot">${esc(a)}</div><div class="val ${igual ? '' : 'er'}">${n}</div><div class="sub">${tot[a] == null ? 'o site não disse o total' : igual ? `<span class="ok">o site mostra ${tot[a]}: o robô viu todos</span>` : `<span class="er">o site mostra ${tot[a]}: o robô não viu ${tot[a] - n}</span>`}</div></div>`;
  }).join('') + `<div class="cartao"><div class="rot">Já entregues (desde sempre)</div><div class="val">${tot.Entregues ?? '?'}</div><div class="sub fr">número do site; o robô não abre esta lista</div></div>`
    + `<div class="cartao"><div class="rot">Documentos de funcionário</div><div class="val">${L.filter((p) => p.cpf).length}</div><div class="sub">de ${new Set(L.filter((p) => p.cpf).map((p) => p.cpf)).size} pessoas; o resto é da empresa</div></div>`;

  const daAba = L.filter((p) => p.aba === estado.abaAtlas);
  const enviadosTab = estado.abaAtlas === 'Enviados por nós';
  // O histórico de envios não guarda a unidade: vem da linha do banco (mesmo id do Neon).
  const unidadeBanco = new Map((estado.atlas.banco || []).map((l) => [String(l.id), l.unidade]));
  const unidadeDe = (id) => unidadeBanco.get(String(id)) || '';
  const envs = [...(estado.atlas.enviados || [])].sort((a, b) => String(b.em).localeCompare(String(a.em)));
  const lista = enviadosTab ? filtrar(doComo(envs, estado.como), ['nome', 'funcionario', 'competencia', 'msg']) : filtrar(daAba, ['documento', 'funcionario', 'unidades', 'pedido', 'competencia', 'categoria', 'tipo']);
  estado.vis = lista;
  const linhaEnv = (e, k) => `<tr data-i="${k}">
      ${celEnviado(e)}<td class="doc">${esc(e.nome)}<span class="cod">${esc(unidadeDe(e.id))}</span></td><td>${esc(e.funcionario || '')}</td><td class="m">${esc(e.competencia || '')}</td>
      <td>${e.status_atlas ? `<span class="selo ${corAtlas(e.status_atlas)}">${esc(STATUS_ATLAS[e.status_atlas] || e.status_atlas)}</span>` : ''}</td>
      <td>${e.schedule_id ? `<a href="https://gestao.atlasfacilities.com.br/document-schedule/${encodeURIComponent(e.schedule_id)}/general-information?resume=false" target="_blank" rel="noopener">abrir</a>` : ''}</td></tr>`;
  // Por dia só na ordem de envio; ordenado por outra coluna, lista corrida.
  const linhasEnv = !enviadosTab ? '' : (!estado.ordem || estado.ordem[0] === 'em') ? linhasPorDia(lista, 7, linhaEnv) : lista.map(linhaEnv).join('');
  // Colunas: situação em uma frase · documento · de quem · mês · prazo · quando foi enviado · próximo passo · link.
  const linhas = enviadosTab ? '' : lista.map((p, k) => {
    const n = nosso[p.document_schedule_id];
    const novo = ant && !antSched.has(p.document_schedule_id);
    const mudou = ant && !novo && antIds.get(p.document_schedule_id + '|' + p.aba)?.status !== p.status && antIds.has(p.document_schedule_id + '|' + p.aba);
    const r = resumoAtlas(p);
    const quemEnviou = n?.enviado_em ? (n.enviado_auto ? 'pelo nosso robô' : 'pelo nosso painel') : 'por outra pessoa (fora do robô)';
    const enviado = p.enviado_em ? `${esc(hora(p.enviado_em))}<span class="cod">${quemEnviou}</span>` : n?.enviado_em ? `${esc(hora(n.enviado_em))}<span class="cod">${n.enviado_auto ? 'pelo nosso robô' : 'pelo nosso painel'}</span>` : '<span class="fr">ainda não</span>';
    return `<tr data-i="${k}">
      ${celResumo(r, `${STATUS_ATLAS[p.status] || p.status}${p.critico ? ', crítico' : ''}`)}
      <td class="doc">${novo ? '<span class="selo in">apareceu agora</span> ' : ''}${mudou ? `<span class="selo at" title="antes: ${esc(STATUS_ATLAS[antIds.get(p.document_schedule_id + '|' + p.aba).status] || '')}">mudou</span> ` : ''}${esc(p.documento)}<span class="cod">${esc(p.unidades || '')}</span></td>
      <td>${p.funcionario ? `${esc(p.funcionario)}${p.cpf ? `<span class="cod">${esc(cpfMasc(p.cpf))}</span>` : ''}` : '<span class="fr">da empresa</span>'}</td>
      <td class="m">${esc(p.competencia || '')}</td>
      <td class="m">${esc(data(p.prazo_envio))}</td>
      <td class="m">${enviado}</td>
      ${celPasso(r)}
      <td>${p.document_schedule_id ? `<a href="https://gestao.atlasfacilities.com.br/document-schedule/${encodeURIComponent(p.document_schedule_id)}/general-information?resume=false" target="_blank" rel="noopener" title="Abre este documento no site do Atlas (só olhar; nada é enviado)">ver no site</a>` : ''}</td>
    </tr>`;
  }).join('');

  const outrasLeituras = leituras.filter((a) => a !== leituras[0]);
  document.getElementById('tela').innerHTML = `
    ${painel_ok ? '' : '<div class="aviso">O painel não respondeu: a parte "o que o nosso sistema está fazendo" ficou vazia. Clique em Atualizar daqui a pouco.</div>'}
    ${comoLer('atlas', `<p>O <b>Atlas</b> é o site onde a Equatorial pede os documentos da NIP. <b>Cada linha da tabela é um documento que ela está pedindo.</b></p>
      <p>O nosso robô entra no site de hora em hora, copia esta lista e tenta achar e enviar o documento sozinho. Esta tela mostra o que ele viu, do jeito que está no site.</p>
      <p>Para cada documento, leia só duas colunas: <b>Situação</b> (como está, em uma frase) e <b>Próximo passo</b> (o que fazer e quem faz). <b>Clique em qualquer linha</b> para ver a explicação completa. Nada nesta tela envia ou muda coisa alguma.</p>`)}
    <div class="cartoes">${cartoes}</div>
    <div class="seg" id="abasAtlas">${ABAS_ATLAS.map((a) => `<button data-aba="${esc(a)}" class="${a === estado.abaAtlas ? 'on' : ''}">${esc(a)}<span class="n">${L.filter((p) => p.aba === a).length}</span></button>`).join('')}<button data-aba="Enviados por nós" class="${enviadosTab ? 'on' : ''}" title="Histórico de envios do painel: no Atlas eles estão na aba Entregues">Enviados por nós<span class="n">${envs.length}</span></button></div>
    <p class="oque">${OQUE_ATLAS[estado.abaAtlas] || ''}</p>
    ${enviadosTab ? `${resumoEnvios(envs)}${segComo(envs)}<div class="filtros"><input type="search" data-f="busca" placeholder="Procurar documento, funcionário, mês" value="${esc(estado.f.busca || '')}"><span class="dica">No site do Atlas, estes ficam na aba "Entregues". A última coluna mostra como o site estava logo depois do envio.</span><span class="contagem">${lista.length} de ${envs.length}</span></div>
    <div class="tabela"><table><thead><tr>${th('em', 'Enviado em')}<th>Quem enviou</th>${th('nome', 'Documento')}${th('funcionario', 'Funcionário')}${th('competencia', 'Mês')}${th('status_atlas', 'Como ficou no site')}<th></th></tr></thead>
      <tbody>${linhasEnv || '<tr><td colspan="7" class="fr">Nenhum envio registrado.</td></tr>'}</tbody></table></div>` : `
    <div class="filtros">
      <input type="search" data-f="busca" placeholder="Procurar funcionário, documento, pedido" value="${esc(estado.f.busca || '')}">
      ${opcoes(daAba, 'unidades', 'Unidade')}${opcoes(daAba, 'documento', 'Documento')}${opcoes(daAba, 'competencia', 'Mês')}${opcoes(daAba, 'status', 'Situação no site')}${opcoes(daAba, 'categoria', 'Categoria')}
      <label><input type="checkbox" data-f="comFunc" ${estado.f.comFunc ? 'checked' : ''}> só de funcionário</label>
      ${estado.atlas?.cpf_oculto ? '' : `<label><input type="checkbox" id="verCpf" ${estado.verCpf ? 'checked' : ''}> mostrar CPF</label>`}
      <label title="Mostra o que apareceu, mudou ou sumiu desde uma olhada anterior do robô">Comparar com a olhada de <select id="antiga"><option value="">não comparar</option>${outrasLeituras.map((a) => `<option value="${esc(a)}" ${estado.antigaAtlas?._arq === a ? 'selected' : ''}>${esc(nomeLeitura(a))}</option>`).join('')}</select></label>
      <span class="contagem">${lista.length} de ${daAba.length}</span>
    </div>
    <div class="tabela"><table>
      <thead><tr>${th('status', 'Situação')}${th('documento', 'Documento e unidade')}${th('funcionario', 'De quem')}${th('competencia', 'Mês')}${th('prazo_envio', 'Prazo')}${th('enviado_em', 'Arquivo enviado em')}<th>Próximo passo</th><th></th></tr></thead>
      <tbody>${linhas || '<tr><td colspan="8" class="fr">Nada com esses filtros.</td></tr>'}</tbody>
    </table></div>`}
    ${ant ? `<h2>Sumiram da lista desde a olhada de ${esc(nomeLeitura(ant._arq))} (${saiu.length}): foram entregues ou a Equatorial tirou o pedido</h2>
      <div class="tabela" style="max-height:none"><table><thead><tr><th>Aba</th><th>Documento</th><th>Funcionário</th><th>Unidade</th><th>Competência</th><th>Status antes</th></tr></thead><tbody>
      ${saiu.map((p) => `<tr class="saiu"><td>${esc(p.aba)}</td><td>${esc(p.documento)}</td><td>${esc(p.funcionario || '')}</td><td>${esc(p.unidades || '')}</td><td class="m">${esc(p.competencia || '')}</td><td>${esc(STATUS_ATLAS[p.status] || p.status)}</td></tr>`).join('') || '<tr><td colspan="6" class="fr">Nenhuma.</td></tr>'}
      </tbody></table></div>` : ''}
  `;
  ligar();
}

// ---------- Histórico do robô ----------
// Tudo o que os robôs fizeram, do mais novo para o mais antigo, agrupado por dia. As olhadas sem novidade ficam escondidas
// (o robô olha o Atlas de hora em hora e o Bernhoeft a cada 30 min): só aparecem marcando a caixa.
const COR_HIST = { envio: 'ok', recusa: 'er', parou: 'er', erro: 'er', segurou: 'at', mudanca: 'in', leitura: '' };
const ROBOS_HIST = [['todos', 'Todos'], ['Atlas', 'Robô Atlas'], ['Bernhoeft', 'Robô Bernhoeft'], ['Sincronização', 'Sincronização da Factorial']];
function desenharHist() {
  const H = estado.hist, ag = H.agora || {};
  document.getElementById('lido').textContent = `Histórico montado em ${hora(H.gerado_em)}`;
  const todos = H.eventos || [];
  const doRobo = estado.histRobo === 'todos' ? todos : todos.filter((e) => e.robo === estado.histRobo);
  const busca = (estado.f.busca || '').toLowerCase();
  const lista = doRobo.filter((e) => (estado.histTudo || e.tipo !== 'leitura')
    && (!busca || [e.titulo, e.detalhe, ...(e.itens || [])].join(' ').toLowerCase().includes(busca)));
  const conta = (t) => doRobo.filter((e) => e.tipo === t).reduce((s, e) => s + (t === 'envio' || t === 'recusa' || t === 'segurou' ? (e.itens?.length || 1) : 1), 0);

  // Como cada robô está agora.
  const at = ag.atlas, bn = ag.bern, sc = ag.sinc;
  const envioTxt = (m) => !m ? '' : !m.liberado ? 'envio bloqueado no painel' : m.automatico ? 'envio automático ligado' : 'envio liberado, mas só à mão';
  const agora = `<div class="cartoes">
    <div class="cartao"><div class="rot">Robô Atlas agora</div><div class="val ${at?.erro?.length ? 'er' : ''}">${at ? (at.fazendo ? esc(at.fazendo) : 'esperando') : '?'}</div>
      <div class="sub">${at ? `última rodada ${esc(hora(at.ultima))} (${esc(haQuanto(at.ultima))})${at.proxima ? ` · próxima ${esc(soHora(at.proxima))}` : ''}<br>${esc(envioTxt(at))}${at.erro?.length ? `<br><span class="er">deu erro em: ${esc(at.erro.join(', '))}</span>` : ''}` : 'sem informação'}</div></div>
    <div class="cartao"><div class="rot">Robô Bernhoeft agora</div><div class="val">${bn?.ultima ? esc(haQuanto(bn.ultima)) : '?'}</div>
      <div class="sub">${bn?.ultima ? `última olhada ${esc(hora(bn.ultima))}` : 'nenhuma olhada no período'}<br>${esc(envioTxt(bn))}${bn?.automatico ? ` (certeza mínima ${esc({ media: 'média' }[bn.confianca] || bn.confianca)})` : ''}</div></div>
    <div class="cartao"><div class="rot">Sincronização da Factorial</div><div class="val ${sc && !sc.ok ? 'er' : ''}">${sc ? (sc.ok ? 'rodou bem' : 'falhou') : '?'}</div>
      <div class="sub">${sc ? `última vez ${esc(hora(sc.em))} (${esc(haQuanto(sc.em))})` : 'nenhuma rodada no período'}<br>roda de 2 em 2 horas, das 7h às 19h</div></div>
  </div>`;
  const numeros = `<div class="cartoes">
    <div class="cartao"><div class="rot">Documentos enviados</div><div class="val ok">${conta('envio')}</div><div class="sub">nos últimos ${H.dias} dia(s)</div></div>
    <div class="cartao"><div class="rot">Envios recusados pelo site</div><div class="val ${conta('recusa') ? 'er' : ''}">${conta('recusa')}</div><div class="sub">tentou e o site não aceitou</div></div>
    <div class="cartao"><div class="rot">Segurados</div><div class="val ${conta('segurou') ? 'at' : ''}">${conta('segurou')}</div><div class="sub">o robô parou de tentar sozinho</div></div>
    <div class="cartao"><div class="rot">Erros e paradas</div><div class="val ${conta('erro') + conta('parou') ? 'er' : ''}">${conta('erro') + conta('parou')}</div><div class="sub">algo não rodou como devia</div></div>
    <div class="cartao"><div class="rot">Olhadas nos sites</div><div class="val">${conta('leitura') + conta('mudanca')}</div><div class="sub">${conta('mudanca')} com alguma mudança</div></div>
  </div>`;

  let dia = '', linhas = '';
  for (const e of lista) {
    const d = diaDe(e.em);
    if (d !== dia) { dia = d; linhas += `<tr class="dia"><td colspan="4">${esc(d)}</td></tr>`; }
    const itens = e.itens || [];
    linhas += `<tr>
      <td class="m">${esc(soHora(e.em))}</td>
      <td><span class="selo">${esc(e.robo === 'Sincronização' ? 'Sincronização' : 'Robô ' + e.robo)}</span>${e.auto != null && e.tipo === 'envio' ? `<span class="cod">${e.auto ? 'sozinho' : 'pelo painel'}</span>` : ''}</td>
      <td><span class="frase ${COR_HIST[e.tipo] || ''}">${esc(e.titulo)}</span>${e.detalhe ? `<span class="sub">${esc(e.detalhe)}</span>` : ''}</td>
      <td>${itens.length === 1 ? esc(itens[0]) : itens.length ? `<details><summary>ver os ${itens.length}</summary><ul class="itens">${itens.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></details>` : ''}</td>
    </tr>`;
  }
  const escondidas = doRobo.filter((e) => e.tipo === 'leitura').length;

  document.getElementById('tela').innerHTML = `
    ${comoLer('hist', `<p>Esta tela é o <b>diário dos robôs</b>: tudo o que eles fizeram, do mais novo para o mais antigo. Cada linha é uma ação, com a hora.</p>
      <p><b>Verde</b> = enviou um documento. <b>Vermelho</b> = tentou e o site recusou, ou algo deu erro. <b>Amarelo</b> = o robô segurou um documento e não vai mais tentar sozinho. <b>Azul</b> = olhou o site e algo mudou (apareceu, saiu ou mudou de situação).</p>
      <p>As olhadas em que nada mudou ficam escondidas para não poluir; marque "mostrar também as olhadas sem novidade" para ver todas. Quando uma linha junta vários documentos, clique em "ver os N".</p>`, false)}
    ${agora}
    ${numeros}
    <div class="seg" id="histRobo">${ROBOS_HIST.map(([r, t]) => `<button data-r="${esc(r)}" class="${r === estado.histRobo ? 'on' : ''}">${esc(t)}<span class="n">${(r === 'todos' ? todos : todos.filter((e) => e.robo === r)).filter((e) => e.tipo !== 'leitura').length}</span></button>`).join('')}</div>
    <div class="filtros">
      <input type="search" data-f="busca" placeholder="Procurar documento, unidade, mês, motivo" value="${esc(estado.f.busca || '')}">
      <label>Período <select id="histDias">${[1, 3, 7, 15, 30].map((d) => `<option value="${d}" ${d === estado.histDias ? 'selected' : ''}>${d === 1 ? 'último dia' : `últimos ${d} dias`}</option>`).join('')}</select></label>
      <label><input type="checkbox" id="histTudo" ${estado.histTudo ? 'checked' : ''}> mostrar também as olhadas sem novidade (${escondidas})</label>
      <span class="contagem">${lista.length} ações</span>
    </div>
    <div class="tabela"><table><thead><tr><th>Hora</th><th>Quem</th><th>O que fez</th><th>Quais documentos</th></tr></thead>
      <tbody>${linhas || '<tr><td colspan="4" class="fr">Nenhuma ação com esses filtros.</td></tr>'}</tbody></table></div>`;
  ligar();
  document.querySelectorAll('#histRobo button').forEach((b) => b.addEventListener('click', () => { estado.histRobo = b.dataset.r; desenhar(); }));
  document.getElementById('histDias').addEventListener('change', (ev) => { estado.histDias = Number(ev.target.value); carregar(); });
  document.getElementById('histTudo').addEventListener('change', (ev) => { estado.histTudo = ev.target.checked; desenhar(); });
}

// ---------- Bernhoeft ----------
function desenharBern() {
  const { coleta, leituras } = estado.bern;
  const L = coleta.itens || [];
  document.getElementById('lido').textContent = `O robô olhou o Bernhoeft pela última vez em ${hora(coleta.coletado_em)} (${haQuanto(coleta.coletado_em)})`;
  const ant = estado.antigaBern;
  const antMap = ant ? new Map(ant.itens.map((x) => [x.chave, x])) : null;
  const atu = new Set(L.map((x) => x.chave));
  const saiu = ant ? ant.itens.filter((x) => !atu.has(x.chave)) : [];

  const status = [...new Set(L.map((x) => x.status))];
  // A situação de cada documento vem do xlsx do relatório 012 que o robô baixou por último (o nome traz a data do pedido).
  const m012 = /(\d\d)-(\d\d)-(\d{4})-(\d\d)-(\d\d)-\d\d_/.exec(coleta.relatorio012?.ultimo_baixado || '');
  const data012 = m012 ? new Date(`${m012[3]}-${m012[2]}-${m012[1]}T${m012[4]}:${m012[5]}:00-03:00`) : null;
  const dias012 = data012 ? Math.floor((Date.now() - data012) / 86400000) : null;
  const aviso012 = !data012
    ? '<div class="aviso">Não dá para saber de quando é o relatório 012 usado nesta leitura: a situação dos documentos pode estar velha.</div>'
    : dias012 >= 2
      ? `<div class="aviso"><b>Atenção: a situação abaixo está velha.</b> Ela é de ${esc(hora(data012))} (${dias012} dias atrás). O Bernhoeft só informa a situação de cada documento num relatório (o "012"), e o último que o robô conseguiu é dessa data. Por isso, o que foi enviado depois dela (por exemplo, os dois de 26/10) ainda aparece como "falta entregar".</div>`
      : '';
  const cartoes = `<div class="cartao"><div class="rot">Documentos pedidos</div><div class="val">${L.length}</div><div class="sub">${data012 ? `situação de <span class="${dias012 >= 2 ? 'at' : ''}">${esc(hora(data012))}</span>` : ''}</div></div>`
    + status.map((s) => `<div class="cartao"><div class="rot">${esc(statusBernSimples(s))}</div><div class="val ${corBern(s)}">${L.filter((x) => x.status === s).length}</div><div class="sub fr">no site: ${esc(s)}</div></div>`).join('')
    + `<div class="cartao"><div class="rot">De funcionário</div><div class="val">${L.filter((x) => x.colaboradores).length}</div><div class="sub fr">o resto é documento da empresa</div></div>`;

  const envTab = estado.statusBern === '__env';
  const envs = [...(estado.bern.envio?.enviados || [])].sort((a, b) => String(b.em).localeCompare(String(a.em)));
  const daAba = envTab ? [] : estado.statusBern === 'todos' ? L : L.filter((x) => x.status === estado.statusBern);
  const lista = envTab ? filtrar(doComo(envs, estado.como), ['contrato', 'documento', 'msg']) : filtrar(daAba, ['contrato', 'contratada', 'area', 'descricao', 'colaboradores', 'unidade', 'competencia']);
  estado.vis = lista;
  const linhaEnv = (e, k) => `<tr data-i="${k}">${celEnviado(e)}<td class="m">${esc(e.contrato)}</td><td class="doc">${esc(e.documento)}</td>
      <td>${e.status_portal ? `<span class="selo ${corBern(e.status_portal)}">${esc(e.status_portal)}</span>` : ''}<span class="cod">${esc(e.competencia_status || '')}</span></td>
      <td>${esc(e.confianca || '')}</td><td>${esc(e.arquivo_portal || '')}${e.kb ? `<span class="cod">${esc(e.kb)} KB</span>` : ''}</td></tr>`;
  const linhasEnv = !envTab ? '' : (!estado.ordem || estado.ordem[0] === 'em') ? linhasPorDia(lista, 7, linhaEnv) : lista.map(linhaEnv).join('');
  const linhas = envTab ? '' : lista.map((x, k) => {
    const a = antMap?.get(x.chave);
    const novo = ant && !a;
    const mudou = a && a.status !== x.status;
    const r = resumoBern(x);
    return `<tr data-i="${k}">
      ${celResumo(r, x.status)}
      <td class="doc">${novo ? '<span class="selo in">apareceu agora</span> ' : ''}${mudou ? `<span class="selo at" title="antes: ${esc(a.status)}">mudou</span> ` : ''}${esc(x.descricao)}<span class="cod">${esc([x.area, x.unidade].filter(Boolean).join(' · '))}</span></td>
      <td class="m">${esc(x.contrato)}</td>
      <td>${x.colaboradores ? esc(x.colaboradores) : '<span class="fr">da empresa</span>'}</td>
      <td class="m">${esc(x.competencia)}</td>
      ${celPasso(r)}
    </tr>`;
  }).join('');

  const r012 = coleta.relatorio012;
  const outras = leituras.filter((a) => a !== leituras[0]);
  document.getElementById('tela').innerHTML = `
    ${comoLer('bern', `<p>O <b>Bernhoeft</b> (ContractWeb) é o outro site onde a Equatorial pede documentos, separados por contrato. <b>Cada linha da tabela é um documento pedido em um contrato.</b></p>
      <p>O nosso robô olha este site a cada 30 minutos. Para os documentos da empresa, ele procura o arquivo e pode enviar sozinho. Os documentos de funcionário ainda são enviados à mão.</p>
      <p>Leia só duas colunas: <b>Situação</b> (como está) e <b>Próximo passo</b> (o que fazer e quem faz). <b>Clique em qualquer linha</b> para ver a explicação completa. Nada nesta tela envia ou muda coisa alguma.</p>`)}
    ${aviso012}
    <div class="cartoes">${cartoes}</div>
    <div class="seg" id="statusBern">${['todos', ...status].map((s) => `<button data-st="${esc(s)}" class="${s === estado.statusBern ? 'on' : ''}" title="${s === 'todos' ? '' : `No site: ${esc(s)}`}">${s === 'todos' ? 'Todos' : esc(statusBernSimples(s))}<span class="n">${s === 'todos' ? L.length : L.filter((x) => x.status === s).length}</span></button>`).join('')}<button data-st="__env" class="${envTab ? 'on' : ''}">Enviados por nós<span class="n">${envs.length}</span></button></div>
    <p class="oque">${envTab ? '<b>Enviados por nós:</b> o que o nosso sistema já mandou para o site. "Robô" = saiu sozinho; "painel" = alguém clicou em Enviar.' : '<b>Vermelho</b> = ainda falta entregar. <b>Azul</b> = já entregue, esperando alguém do Bernhoeft olhar. <b>Verde</b> = já olharam (o resultado, aprovado ou não, só aparece no site).'}</p>
    ${envTab ? `${resumoEnvios(envs)}${segComo(envs)}<div class="filtros"><input type="search" data-f="busca" placeholder="Procurar contrato, documento" value="${esc(estado.f.busca || '')}"><span class="dica">"Como ficou no site" = o que o site mostrava logo depois do envio. "Certeza" = o quanto o robô tinha certeza de que o arquivo era o certo.</span><span class="contagem">${lista.length} de ${envs.length}</span></div>

    <div class="filtros">
      <input type="search" data-f="busca" placeholder="Procurar contrato, área, documento, funcionário" value="${esc(estado.f.busca || '')}">
      ${opcoes(daAba, 'contrato', 'Contrato')}${opcoes(daAba, 'area', 'Área')}${opcoes(daAba, 'unidade', 'Unidade')}${opcoes(daAba, 'competencia', 'Mês')}${opcoes(daAba, 'tipo', 'Tipo')}
      <label title="Mostra o que apareceu, mudou ou sumiu desde uma olhada anterior do robô">Comparar com a olhada de <select id="antiga"><option value="">não comparar</option>${outras.map((a) => `<option value="${esc(a)}" ${estado.antigaBern?._arq === a ? 'selected' : ''}>${esc(nomeLeitura(a))}</option>`).join('')}</select></label>
      <span class="contagem">${lista.length} de ${daAba.length}</span>
    </div>
    <div class="tabela"><table>
      <thead><tr>${th('status', 'Situação')}${th('descricao', 'Documento e área')}${th('contrato', 'Contrato')}${th('colaboradores', 'De quem')}${th('competencia', 'Mês')}<th>Próximo passo</th></tr></thead>
      <tbody>${linhas || '<tr><td colspan="6" class="fr">Nada com esses filtros.</td></tr>'}</tbody>
    </table></div>`}
    ${ant ? `<h2>Sumiram da lista desde a olhada de ${esc(nomeLeitura(ant._arq))} (${saiu.length}): foram entregues ou a Equatorial tirou o pedido</h2>
      <div class="tabela" style="max-height:none"><table><thead><tr><th>Contrato</th><th>Área</th><th>Competência</th><th>Documento</th><th>Status antes</th></tr></thead><tbody>
      ${saiu.map((x) => `<tr class="saiu"><td>${esc(x.contrato)}</td><td>${esc(x.area)}</td><td>${esc(x.competencia)}</td><td>${esc(x.descricao)}</td><td>${esc(x.status)}</td></tr>`).join('') || '<tr><td colspan="5" class="fr">Nenhuma.</td></tr>'}
      </tbody></table></div>` : ''}
    ${r012 ? `<h2>Relatórios "012" pedidos ao site (é deles que vem a situação de cada documento) · ${r012.total_pedidos ?? r012.pedidos?.length ?? 0}</h2>
      <div class="tabela" style="max-height:320px"><table><thead><tr><th>Solicitado em</th><th>Status</th><th>Contratante</th><th>Grupo/área</th><th>Unidade</th><th>Download</th></tr></thead><tbody>
      ${(r012.pedidos || []).map((p) => `<tr><td class="m">${esc(p.solicitado_em)}</td><td>${esc(p.status)}</td><td>${esc(p.contratante)}</td><td>${esc(p.grupo_area)}</td><td>${esc(p.unidade)}</td><td>${p.tem_download ? 'sim' : '<span class="fr">não</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
  `;
  ligar();
}

// ---------- fichas ----------
// Mesmo roteiro das fichas de 27/10: como está, no portal agora, o que aconteceu, por quê, o que fazer (quem), resolvido quando.
// Se a pendência foi analisada à mão (DIAG do painel), essa análise vem primeiro; embaixo, a leitura automática de agora.
const semAcento = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const soDig = (s) => String(s || '').replace(/\D/g, '').replace(/^0+/, '');
const DIA = 86400000;
const diasAte = (iso) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ''); return m ? Math.round((new Date(+m[1], m[2] - 1, +m[3]) - new Date(new Date().toDateString())) / DIA) : null; };
const comp = (s) => { const t = String(s || ''); const a = /^(\d{4})-(\d\d)/.exec(t), b = /(\d\d)\/(\d{4})/.exec(t); return a ? `${a[2]}/${a[1]}` : b ? `${b[1]}/${b[2]}` : t; };
const ESTADO_NEON = {
  PENDENTE_ENVIO: 'ainda sem arquivo', LOCALIZADO: 'arquivo encontrado', COMPOSTO: 'arquivo montado (juntamos várias partes num PDF só)', ENVIADO: 'já enviado',
  REJEITADO: 'o arquivo foi recusado pela Equatorial', DIVERGENTE_FACTORIAL: 'o arquivo não bate com o que está na Factorial',
};
const DIAG_OK = typeof DIAG !== 'undefined' ? DIAG : [];

function data012() {
  const m = /(\d\d)-(\d\d)-(\d{4})-(\d\d)-(\d\d)-\d\d_/.exec(estado.bern?.coleta?.relatorio012?.ultimo_baixado || '');
  return m ? new Date(`${m[3]}-${m[2]}-${m[1]}T${m[4]}:${m[5]}:00-03:00`) : null;
}

// Linha do banco (Neon) que corresponde à linha da coleta: primeiro pelo id que o painel liga ao schedule_id,
// depois por documento + competência + unidade, desempatando por funcionário, pedido e prazo.
function bancoDe(p) {
  const { banco = [], nosso = {} } = estado.atlas;
  const n = nosso[p.document_schedule_id];
  if (n?.id) { const b = banco.find((x) => String(x.id) === String(n.id)); if (b) return b; }
  const cand = banco.filter((b) => semAcento(b.documento) === semAcento(p.documento) && comp(b.competencia) === comp(p.competencia) && semAcento(b.unidade) === semAcento(p.unidades));
  const nota = (b) => (semAcento(b.funcionario) === semAcento(p.funcionario) ? 4 : 0) + (String(b.pedido || '') === String(p.pedido || '') ? 2 : 0) + (b.prazo === String(p.prazo_envio || '').slice(0, 10) ? 1 : 0);
  return cand.sort((a, b) => nota(b) - nota(a))[0] || null;
}

function situacaoNossa(p, b, n, env) {
  // O que o nosso lado sabe e por que a pendência ainda não saiu.
  const modo = estado.atlas.modo || {};
  const r = { agora: '', aconteceu: '', porque: '', fazer: [] };
  const segurada = (n?.motivos || []).some((m) => /segurad/i.test(m));
  if (env) {
    r.agora = `Nós enviamos em ${hora(env.em)} (${env.auto ? 'automático' : 'pelo painel'}), mas esta leitura do Atlas ainda mostra o item sem arquivo.`;
    r.porque = 'Ou o Atlas não guardou o arquivo, ou a pendência foi reaberta depois do envio. Não é normal: o enviado sai de "Atrasados"/"Próximas".';
    r.fazer.push(['Abrir no Atlas e ver se o arquivo está lá.', 'equipe']);
    return r;
  }
  // Tipo de documento que não existe no banco (nenhuma linha com este nome): o robô não tem regra para ele (neon.js, REGRAS).
  if (!b && p.aba !== 'Reprovados' && !(estado.atlas.banco || []).some((x) => semAcento(x.documento) === semAcento(p.documento))) {
    r.agora = 'Este tipo de documento não está cadastrado no nosso sistema: o robô vê o pedido, mas não sabe procurar nem enviar.';
    r.aconteceu = `Nenhuma pendência "${p.documento}" foi gravada no nosso banco.`;
    r.porque = 'O robô só trata os tipos de documento que têm regra (a lista de nomes no neon.js). Este nome não está na lista, ou o site mudou o nome.';
    r.fazer.push(['Enviar à mão no site do Atlas enquanto isso.', 'NIP'], ['Pedir para cadastrar este tipo de documento no robô.', 'quem cuida do sistema']);
    return r;
  }
  if (!b) {
    r.agora = 'Não achamos esta pendência no banco (Neon).';
    r.porque = p.aba === 'Reprovados' ? 'A aba Reprovados não é gravada no banco: o item reprovado entra pela aba Atrasados.' : 'Pode ser nova: o robô grava no banco a cada rodada (60 min). Se continuar assim depois de uma rodada, a ligação falhou.';
    return r;
  }
  r.agora = `No nosso sistema: ${ESTADO_NEON[b.estado] || b.estado}${b.fonte ? ` (o arquivo vem da ${b.fonte})` : ''}.`;
  if (b.estado === 'ENVIADO') {
    r.aconteceu = 'O banco diz que foi enviado, mas o Atlas ainda mostra o item sem arquivo.';
    r.porque = 'O envio foi registrado fora do histórico do painel, ou o Atlas reabriu o item.';
    r.fazer.push(['Abrir no Atlas e conferir se há arquivo no item.', 'equipe']);
  } else if (b.estado === 'DIVERGENTE_FACTORIAL') {
    r.aconteceu = 'A sincronização da Factorial marcou divergência: o que está na Factorial não bate com o que o Atlas pede.';
    r.fazer.push(['Conferir na Factorial o cadastro e o documento deste funcionário.', 'NIP']);
  } else if (n?.pronta && !segurada) {
    r.aconteceu = 'O PDF está pronto para envio.';
    r.porque = !modo.liberado ? 'O envio está bloqueado no painel (aba 6).' : modo.automatico ? 'O envio automático está ligado: deve sair na próxima rodada do robô (a cada 60 min).' : 'O envio está liberado, mas no modo manual: alguém precisa clicar em Enviar na aba 6.';
  } else if (n) {
    r.aconteceu = segurada ? 'Está segurado no painel: o automático não envia.' : 'O robô conferiu e não está pronto.';
    if (n.motivos?.length) r.porque = n.motivos.join(' · ');
    if (n.resultado && !n.resultado.ok && n.resultado.msg) r.porque = [r.porque, `Última tentativa ${hora(n.resultado.em)}: ${n.resultado.msg}`].filter(Boolean).join(' · ');
    r.fazer.push(segurada ? ['Quando estiver resolvido, clicar em Soltar na aba 6.', 'quem segurou'] : ['Resolver o motivo acima; o robô confere de novo a cada rodada.', 'equipe']);
  } else if (b.busca_factorial && b.busca_factorial.achou === false) {
    r.aconteceu = `O robô procurou na Factorial em ${hora(b.busca_factorial.em)} e não achou.`;
    r.porque = b.busca_factorial.motivo || 'Não há arquivo deste tipo na ficha do funcionário.';
    r.fazer.push(['Anexar o documento na Factorial (o robô busca de novo a cada rodada).', 'NIP']);
  } else if (b.estado === 'PENDENTE_ENVIO') {
    r.aconteceu = 'Ainda não há arquivo para esta pendência.';
    r.porque = b.fila_motivo ? (typeof b.fila_motivo === 'string' ? b.fila_motivo : JSON.stringify(b.fila_motivo)) : 'Nenhum robô registrou busca para este documento.';
    r.fazer.push(['Conferir se o documento existe na origem (Factorial ou SharePoint).', 'NIP']);
  } else {
    r.aconteceu = 'Há arquivo no banco, mas a pendência não está na lista de envio do robô.';
    r.porque = 'A lista de envio é refeita a cada rodada; se continuar fora, o arquivo pode não ter sido baixado na VPS.';
  }
  if (b.pdf_erro) r.porque = [r.porque, `Problema no PDF: ${b.pdf_erro}`].filter(Boolean).join(' · ');
  return r;
}

function fichaAtlas(p) {
  const { nosso = {}, enviados = [] } = estado.atlas;
  const sid = p.document_schedule_id, n = nosso[sid], b = bancoDe(p);
  const env = enviados.find((e) => String(e.schedule_id) === String(sid));
  const st = STATUS_ATLAS[p.status] || p.status;
  const dias = diasAte(p.prazo_envio);
  const prazoTxt = dias == null ? '' : dias < 0 ? `atrasado desde ${data(p.prazo_envio)} (${-dias} dias)` : dias === 0 ? 'vence hoje' : `vence em ${data(p.prazo_envio)} (faltam ${dias} dias)`;
  const nossa = situacaoNossa(p, b, n, env);
  let f;
  if (/Rejected/.test(p.status)) {
    const nosEnv = enviados.filter((e) => String(e.schedule_id) === String(sid)).pop();
    f = {
      titulo: 'Reprovado no Atlas: precisa trocar o arquivo',
      aconteceu: `${nosEnv ? `Nós enviamos em ${hora(nosEnv.em)} (${nosEnv.auto ? 'automático' : 'pelo painel'}).` : p.enviado_em ? `O arquivo foi enviado em ${hora(p.enviado_em)}, fora do robô (equipe ou outro sistema).` : 'O Atlas não informou quando o arquivo foi enviado.'}${p.validado_em ? ` A equipe da Equatorial reprovou em ${hora(p.validado_em)}.` : ' Depois a equipe da Equatorial reprovou.'}`,
      porque: 'O motivo da reprovação fica escrito no Atlas, na tela do item; o robô não lê esse texto. O arquivo reprovado continua anexado, e o Atlas recusa outro ("Documento já importado!") até alguém excluir o antigo.',
      fazer: [['Abrir no Atlas e ler o motivo da reprovação.', 'equipe'], ['Excluir o arquivo reprovado no Atlas.', 'equipe'],
        ['Conseguir o documento certo e enviar (pelo painel, depois de Soltar, ou à mão).', 'NIP + equipe'], ['Enquanto isso, deixar segurado na aba 6 para o automático não tentar.', 'quem usa o painel']],
      resolvido: 'Quando o item sair de Reprovados e aparecer "Em análise" com o arquivo novo.',
      extra: 'O item reprovado aparece duas vezes no Atlas: em Atrasados (se o prazo passou) e em Reprovados. É a mesma pendência.',
    };
  } else if (p.status === 'DelayNotSent' || p.status === 'CriticalDelay' || p.status === 'Delay') {
    f = { titulo: `Atrasado: ${prazoTxt || 'prazo vencido'}${p.critico ? ' · crítico' : ''}`, aconteceu: nossa.aconteceu, porque: nossa.porque, fazer: nossa.fazer,
      resolvido: 'Quando o item sair de Atrasados (com arquivo, vai para "Em análise").' };
  } else {
    f = { titulo: `No prazo: ${prazoTxt || 'sem prazo informado'}`, aconteceu: nossa.aconteceu, porque: nossa.porque, fazer: nossa.fazer,
      resolvido: 'Quando o arquivo subir antes do prazo (o item sai de Próximas entregas e vai para "Em análise").' };
  }
  f.agora = nossa.agora;
  f.portal = `${st}${p.critico ? ' (crítico)' : ''}${prazoTxt ? ` · ${prazoTxt}` : ''}${p.enviado_em ? ` · arquivo enviado em ${hora(p.enviado_em)}` : ''}`;
  f.sabemos = [`Leitura do robô Atlas em ${hora(estado.atlas.coleta.coletado_em)}: aba ${p.aba}, situação ${p.status}.`,
    b ? `Banco (Neon) #${b.id}${b.atualizado_em ? `, atualizado em ${hora(b.atualizado_em)}` : ''}.` : 'Sem linha correspondente no banco.',
    n ? 'Lista de envio do painel (aba 6).' : 'Não está na lista de envio do painel.'];
  f.num = `Atlas · ${p.aba}${b ? ` · #${b.id}` : ''}`;
  f.quem = [p.documento, p.funcionario, p.unidades, p.competencia].filter(Boolean).join(' · ');
  f.link = sid ? `https://gestao.atlasfacilities.com.br/document-schedule/${encodeURIComponent(sid)}/general-information?resume=false` : '';
  f.manual = b ? DIAG_OK.find((d) => d.onde === 'atlas' && d.ids.includes(Number(b.id))) : null;
  f.dados = [['schedule_id', sid], ['Pedido', p.pedido], ['Categoria', p.categoria], ['Tipo', p.tipo], ['Cliente', p.cliente], ['CPF', cpfMasc(p.cpf)],
    ['Validade', data(p.validade)], ['Estado no banco', b?.estado], ['Vem de', b?.fonte], ['Montagem', b?.montagem ? `${b.montagem.tipo}, ${b.montagem.n} parte(s)` : '']];
  return f;
}

function fichaEnviado(e) {
  const s = e.status_atlas;
  const sig = s === 'WaitingForPredecessors'
    ? 'O Atlas recebeu o arquivo, mas este item depende de outro documento do mesmo pedido (o "predecessor"). Provavelmente a análise só começa quando o anterior for aprovado ou enviado.'
    : s === 'ToValidate' ? 'O Atlas recebeu o arquivo e ele está na fila de análise da equipe da Equatorial.'
      : /Rejected/.test(s || '') ? 'Logo depois do envio o item já aparecia reprovado.' : 'O robô não registrou a situação depois do envio.';
  const naColeta = (estado.atlas.coleta.pendencias || []).filter((p) => String(p.document_schedule_id) === String(e.schedule_id));
  return {
    num: `Atlas · enviado por nós · #${e.id}`, quem: [e.nome, e.funcionario, e.competencia].filter(Boolean).join(' · '),
    titulo: `Enviado em ${hora(e.em)} ${e.auto ? 'pelo robô (automático)' : 'pelo painel (à mão)'}`,
    agora: e.msg || 'Envio registrado no histórico do painel.',
    portal: naColeta.length ? `Voltou a aparecer na leitura de agora: ${naColeta.map((p) => `${p.aba}, ${STATUS_ATLAS[p.status] || p.status}`).join(' · ')}.` : 'Não aparece em Atrasados, Próximas nem Reprovados: está na aba "Entregues" do Atlas, que o robô não lê.',
    aconteceu: `Na conferência feita na hora do envio, o Atlas mostrava: ${STATUS_ATLAS[s] || s || 'sem situação'}.`,
    porque: sig,
    fazer: naColeta.some((p) => /Rejected/.test(p.status)) ? [['Abrir no Atlas e ler o motivo da reprovação.', 'equipe']] : [['Nada a fazer agora: esperar a análise. Para achar no Atlas, use o link abaixo ou a aba Entregues.', '']],
    resolvido: 'Quando o Atlas mostrar "Aprovado".',
    sabemos: ['Histórico de envios do painel (out/envio/historico-envios.json).', 'A situação mostrada é a da conferência na hora do envio, não a de hoje.'],
    link: e.schedule_id ? `https://gestao.atlasfacilities.com.br/document-schedule/${encodeURIComponent(e.schedule_id)}/general-information?resume=false` : '',
    manual: DIAG_OK.find((d) => d.onde === 'atlas' && d.ids.includes(Number(e.id))),
    dados: [['schedule_id', e.schedule_id], ['Situação na hora', s]],
  };
}

// Envio do Bernhoeft: se a pendência ainda está na leitura, a ficha dela (que já conta o envio); senão, só o registro do envio.
function fichaEnviadoBern(e) {
  const item = (estado.bern.coleta.itens || []).find((x) => x.chave === e.chave);
  if (item) return fichaBern(item);
  return {
    num: `Bernhoeft · enviado por nós · ${e.contrato}`, quem: e.documento,

    agora: e.msg || 'Envio registrado pelo entregar.js.',
    portal: e.status_portal ? `Logo depois do envio o portal mostrava: ${e.status_portal}.` : '',
    aconteceu: `O arquivo ${e.arquivo_portal || ''} foi para a competência "Documentos da empresa" do contrato (confiança ${e.confianca || '?'}).`,
    porque: 'A pendência não está mais na leitura de agora.',
    fazer: [['Nada a fazer agora: esperar a análise do Bernhoeft/Equatorial.', '']],
    resolvido: 'Quando o relatório 012 mostrar "Analisado".',

}

function fichaBern(x) {
  const { esteira = [], envio } = estado.bern;
  const est = esteira.find((s) => s.chave === x.chave);
  const env = (envio?.enviados || []).filter((e) => e.chave === x.chave).pop();
  const res = envio?.resultados?.[x.chave];
  const seg = envio?.segurar?.[x.chave];
  const modo = envio?.modo || {};
  const d012 = data012();
  const ressalva = d012 ? `A situação "${x.status}" vem do relatório 012 de ${hora(d012)}, não da tela de hoje.` : 'Não dá para saber de quando é o relatório 012 desta leitura.';
  const f = { num: `Bernhoeft · ${x.contrato}`, quem: [x.descricao, x.area, x.competencia].filter(Boolean).join(' · '), portal: x.status, fazer: [] };
  if (env) {
    f.titulo = `Enviado por nós em ${hora(env.em)}`;
    f.agora = `Logo depois do envio, o portal mostrava "${env.status_portal || 'sem situação'}"${env.competencia_status ? ` e a competência "${env.competencia_status}"` : ''}.`;
    f.aconteceu = d012 && d012 < new Date(env.em) ? `O relatório 012 usado é de ${hora(d012)}, antes do envio: por isso aqui ainda aparece "${x.status}". O status só muda quando sair um 012 novo.` : `O relatório 012 já é de depois do envio e mostra "${x.status}".`;
    f.porque = 'O documento de empresa entra na competência "Documentos da empresa" do contrato; o analista do Bernhoeft/Equatorial é quem analisa.';
    f.fazer.push(['Esperar a análise. Se o arquivo enviado estiver errado, trocar no portal antes da análise.', 'equipe']);
    f.resolvido = 'Quando o 012 mostrar "Analisado".';
  } else if (/Não Entregue/i.test(x.status)) {
    f.titulo = 'Não entregue';
    if (x.colaboradores) {
      f.agora = 'Documento de colaborador: não passa pela esteira de documentos de empresa.';
      f.porque = 'Documento de colaborador entra pela Mobilização (etapas 1 a 8), que o robô ainda não faz sozinho.';
      f.fazer.push(['Enviar pela Mobilização no portal.', 'equipe']);
    } else if (!est) {
      f.agora = 'A esteira do painel não tem esta pendência.';
      f.porque = 'A esteira monta a lista a cada leitura (30 min); durante uns 3 minutos ela fica vazia. Se continuar fora, o painel não reconheceu o documento.';
    } else if (est.estado === 'pronto') {
      f.agora = `PDF pronto, confiança ${est.confianca || '?'}${est.arquivos.length ? `: ${est.arquivos.join(', ')}` : ''}.`;
      const ordem = { alta: 3, media: 2, baixa: 1 }, min = modo.confianca || 'alta';
      f.porque = seg ? 'Está segurado no painel: o automático não envia.' : !modo.liberado ? 'O envio está bloqueado no painel (aba 7).' : !modo.automatico ? 'O envio está liberado, mas no modo manual: alguém precisa clicar em Enviar na aba 7.'
        : (ordem[est.confianca] || 0) < (ordem[min] || 3) ? `O automático só manda com confiança ${min} ou maior; esta é ${est.confianca}. Precisa conferir o PDF e enviar à mão, ou trocar o arquivo na origem.` : 'O automático está ligado e a confiança basta: deve sair depois da próxima leitura.';
      f.aconteceu = est.motivo || '';
      f.fazer.push(['Abrir o PDF no painel (aba 7) e conferir se é deste contrato.', 'equipe']);
    } else if (est.estado === 'nao_encontrado') {
      f.agora = 'Nenhum arquivo encontrado na Factorial.';
      f.aconteceu = est.motivo || ''; f.porque = 'Não há na pasta HSEQ arquivo deste tipo para este contrato ou estado.';
      f.fazer.push(['Pedir ao HSEQ o documento deste contrato, com o número do contrato no nome do arquivo.', 'HSEQ']);
    } else if (est.estado === 'erro') {
      f.agora = 'Erro ao montar o PDF.'; f.aconteceu = est.erro || est.motivo || '';
      f.fazer.push(['Clicar em "Buscar na Factorial" na aba 7 para tentar de novo.', 'quem usa o painel']);
    } else {
      f.agora = `Esteira: ${est.estado}.`; f.aconteceu = est.motivo || '';
    }
    if (res && res.msg) f.aconteceu = [f.aconteceu, `Última conferência do robô ${hora(res.em)}: ${res.msg}`].filter(Boolean).join(' · ');
    f.resolvido = 'Quando o arquivo certo subir e o 012 mostrar "Não Analisado" ou "Analisado".';
  } else if (/Não Analisado/i.test(x.status)) {
    f.titulo = 'Entregue, esperando análise'; f.agora = 'Há arquivo no portal.'; f.porque = 'O analista do Bernhoeft/Equatorial ainda não analisou.';
    f.fazer.push(['Nada a fazer agora.', '']); f.resolvido = 'Quando o 012 mostrar "Analisado".';
  } else if (/^Analisado/i.test(x.status)) {
    f.titulo = 'Analisado'; f.agora = 'O documento foi analisado.'; f.porque = 'O relatório 012 não diz se foi aprovado ou reprovado: só a tela do portal mostra.';
    f.fazer.push(['Se precisar saber o resultado, abrir o documento no portal.', 'equipe']);
  } else {
    f.titulo = x.status || 'Sem situação'; f.agora = '';
  }
  f.extra = ressalva;
  f.sabemos = [`Leitura do robô Bernhoeft em ${hora(estado.bern.coleta.coletado_em)}.`, ressalva, est ? `Esteira do painel${est.buscado_em ? `, busca em ${hora(est.buscado_em)}` : ''}.` : 'Sem dados da esteira.'];
  const ct = soDig(String(x.contrato || '').split(/[-\s]/)[0]), t = semAcento([est?.tipo_reconhecido, x.descricao].join(' ')), nomes = (est?.arquivos || []).map(semAcento);
  f.manual = DIAG_OK.find((d) => d.onde === 'bern' && ct && ct.startsWith(soDig(d.contrato)) && d.doc.test(t) && (d.arq ? nomes.some((nm) => d.arq.test(nm)) : !nomes.length));
  f.dados = [['Chave', x.chave], ['Contratada', x.contratada], ['Unidade', x.unidade], ['Tipo', x.tipo], ['Risco', x.risco], ['Colaboradores', x.colaboradores],
    ['Esteira', est ? `${est.estado}${est.confianca ? `, confiança ${est.confianca}` : ''}${est.deixados ? `, ${est.deixados} arquivo(s) deixado(s) de fora` : ''}` : ''], ['Segurado', seg ? 'sim' : '']];
  return f;
}

// ---------- resumo de cada linha, em palavras simples ----------
// Uma frase curta e colorida (vermelho = recusado, amarelo = atrasado, azul = esperando a Equatorial, verde = pronto/ok)
// e o próximo passo, tirado da própria ficha (o mesmo texto que aparece ao clicar).
const QUEM = { equipe: 'equipe Equatorial', NIP: 'NIP', HSEQ: 'HSEQ', 'NIP + equipe': 'NIP e equipe Equatorial', 'quem usa o painel': 'quem usa o painel', 'quem segurou': 'quem segurou' };
function passoDe(f, extra) {
  const p = (f.fazer || [])[0];
  if (p) return { texto: p[0], quem: QUEM[p[1]] || p[1] || '' };
  return extra || { texto: 'Clique na linha para ver os detalhes.', quem: '' };
}
function resumoAtlas(p) {
  const f = fichaAtlas(p), n = estado.atlas.nosso?.[p.document_schedule_id], b = bancoDe(p), modo = estado.atlas.modo || {};
  const dias = diasAte(p.prazo_envio), segurada = (n?.motivos || []).some((m) => /segurad/i.test(m));
  let nosso = 'ainda não temos o arquivo';
  if (n?.enviado_em) nosso = 'já enviamos';
  else if (segurada) nosso = 'segurado: o robô não envia sozinho';
  else if (n?.pronta) nosso = 'arquivo pronto, falta enviar';
  else if (b && ['LOCALIZADO', 'COMPOSTO'].includes(b.estado)) nosso = 'temos o arquivo, mas ele ainda não pode ir';
  else if (b?.estado === 'REJEITADO') nosso = 'o arquivo que temos foi recusado';
  else if (!b) nosso = (estado.atlas.banco || []).some((x) => semAcento(x.documento) === semAcento(p.documento)) ? 'não está no nosso sistema' : 'o robô não conhece este tipo de documento';
  let cor, frase;
  if (/Rejected/.test(p.status)) { cor = 'er'; frase = 'Recusado: precisa mandar outro arquivo'; if (nosso === 'ainda não temos o arquivo') nosso = 'ainda não temos um arquivo novo'; }
  else if (/Delay/.test(p.status)) { cor = 'at'; frase = dias != null && dias < 0 ? `Atrasado há ${-dias} dia(s)` : 'Atrasado'; }
  else { cor = 'in'; frase = dias == null ? 'No prazo' : dias === 0 ? 'No prazo: vence hoje' : `No prazo: faltam ${dias} dia(s)`; }
  const pronto = n?.pronta && !segurada;
  return { cor, frase, nosso, passo: passoDe(f, pronto ? { texto: modo.liberado && modo.automatico ? 'Nada: o robô envia sozinho na próxima rodada.' : 'Clicar em Enviar no painel (aba 6).', quem: modo.liberado && modo.automatico ? 'robô' : 'quem usa o painel' } : null) };
}
function resumoBern(x) {
  const f = fichaBern(x);
  const est = (estado.bern.esteira || []).find((s) => s.chave === x.chave);
  let cor = '', frase = f.titulo, nosso = '';
  if (/^Enviado/.test(f.titulo)) { cor = 'in'; frase = 'Já enviamos: esperando a análise'; }
  else if (/Não Entregue/i.test(x.status)) {
    cor = 'er'; frase = 'Falta entregar';
    nosso = x.colaboradores ? 'documento de funcionário: vai pela Mobilização' : !est ? 'o robô não reconheceu este documento'
      : est.estado === 'pronto' ? `arquivo pronto (certeza ${est.confianca || '?'})` : est.estado === 'nao_encontrado' ? 'não achamos o arquivo' : est.estado === 'erro' ? 'erro ao montar o arquivo' : 'procurando o arquivo';
  } else if (/Não Analisado/i.test(x.status)) { cor = 'in'; frase = 'Entregue: esperando a análise'; }
  else if (/^Analisado/i.test(x.status)) { cor = 'ok'; frase = 'Já foi analisado'; }
  return { cor, frase, nosso, passo: passoDe(f) };
}
const celResumo = (r, site) => `<td class="resumo"><span class="frase ${r.cor}">${esc(r.frase)}</span>${r.nosso ? `<span class="sub">${esc(r.nosso)}</span>` : ''}${site ? `<span class="cod">no site: ${esc(site)}</span>` : ''}</td>`;
const celPasso = (r) => `<td class="passo">${esc(r.passo.texto)}${r.passo.quem ? `<span class="quem">quem faz: ${esc(r.passo.quem)}</span>` : ''}</td>`;

// Quadro "Como ler esta tela": aberto na primeira vez; quem fechar não vê de novo (fica guardado no navegador).
function comoLer(id, html, legenda = true) {
  const fechado = localStorage.getItem('espelho-ajuda-' + id) === 'fechado';
  return `<details class="ajuda" data-ajuda="${id}" ${fechado ? '' : 'open'}><summary>Como ler esta tela</summary><div>${html}
    ${legenda ? '' : '<!--'}<div class="legenda"><span><i class="er"></i>vermelho: recusado ou faltando, precisa de alguém</span><span><i class="at"></i>amarelo: atrasado</span><span><i class="in"></i>azul: no prazo ou esperando a Equatorial</span><span><i class="ok"></i>verde: tudo certo</span></div>${legenda ? '' : '-->'}</div></details>`;
}

function mostrarFicha(f) {
  const el = document.getElementById('ficha');
  const linha = (t, v) => v ? `<dt>${t}</dt><dd>${v}</dd>` : '';
  const fazer = (l) => l?.length ? `<ol>${l.map(([o, q]) => `<li>${esc(o)}${q ? `<span class="quem">${esc(q)}</span>` : ''}</li>`).join('')}</ol>` : '';
  const lista = (l) => l?.length ? `<ul>${l.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>` : '';
  const m = f.manual;
  el.innerHTML = `<button class="btn fechar" id="fecharFicha" title="Fechar (Esc)">Fechar</button>
    <div class="num">${esc(f.num)}</div><h3>${esc(f.titulo)}</h3><div class="quem-e">${esc(f.quem)}</div>
    ${m ? `<div class="manual"><div class="num">analisado em 27/10 · ficha ${esc(m.ficha)}${GRUPOS_DIAG[m.grupo] ? ` · ${esc(GRUPOS_DIAG[m.grupo])}` : ''}</div><div class="tit">${esc(m.titulo)}</div><dl>
      ${linha('Como estava em 27/10', esc(m.agora))}${linha('O que aconteceu', esc(m.aconteceu))}${linha('Por quê', esc(m.porque))}${linha('O que fazer', fazer(m.fazer))}${linha('Resolvido quando', esc(m.resolvido))}
      ${linha('Como sabemos', lista(m.sabemos))}${linha('Para não acontecer de novo', lista(m.prevenir))}</dl></div><h2>Leitura de agora</h2>` : ''}
    <dl>${linha('Como está', esc(f.agora))}${linha('No portal agora', esc(f.portal))}${linha('O que aconteceu', esc(f.aconteceu))}${linha('Por quê', esc(f.porque))}
      ${linha('O que fazer', fazer(f.fazer))}${linha('Resolvido quando', esc(f.resolvido))}${f.extra ? `<dt>Atenção</dt><dd class="ressalva">${esc(f.extra)}</dd>` : ''}${linha('Como sabemos', lista(f.sabemos))}</dl>
    ${f.link ? `<p><a href="${esc(f.link)}" target="_blank" rel="noopener">Abrir no Atlas</a> <span class="dica">(só a tela; nada é enviado)</span></p>` : ''}
    <details class="dados"><summary>Detalhes técnicos (para quem dá suporte)</summary><table>${(f.dados || []).filter(([, v]) => v).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></details>`;
  el.classList.add('aberta');
  document.getElementById('fecharFicha').addEventListener('click', fecharFicha);
}
function fecharFicha() {
  document.getElementById('ficha').classList.remove('aberta');
  document.querySelectorAll('tr.sel').forEach((t) => t.classList.remove('sel'));
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharFicha(); });

// ---------- eventos ----------
function ligar() {
  document.querySelectorAll('tbody tr[data-i]').forEach((tr) => tr.addEventListener('click', (ev) => {
    if (ev.target.closest('a')) return;
    const x = estado.vis[Number(tr.dataset.i)];
    if (!x) return;
    document.querySelectorAll('tr.sel').forEach((t) => t.classList.remove('sel'));
    tr.classList.add('sel');
    mostrarFicha(estado.portal === 'bern' ? (estado.statusBern === '__env' ? fichaEnviadoBern(x) : fichaBern(x)) : estado.abaAtlas === 'Enviados por nós' ? fichaEnviado(x) : fichaAtlas(x));
  }));
  document.querySelectorAll('[data-f]').forEach((el) => {
    const ev = el.type === 'search' ? 'input' : 'change';
    el.addEventListener(ev, () => {
      estado.f[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
      const pos = el.type === 'search' ? el.selectionStart : null;
      desenhar();
      if (pos != null) { const n = document.querySelector('[data-f=busca]'); n.focus(); n.setSelectionRange(pos, pos); }
    });
  });
  document.querySelectorAll('[data-ord]').forEach((el) => el.addEventListener('click', () => {
    const c = el.dataset.ord;
    estado.ordem = estado.ordem?.[0] === c ? (estado.ordem[1] > 0 ? [c, -1] : null) : [c, 1];
    desenhar();
  }));
  document.querySelectorAll('#abasAtlas button').forEach((b) => b.addEventListener('click', () => { estado.abaAtlas = b.dataset.aba; estado.f = { busca: estado.f.busca }; desenhar(); }));
  document.querySelectorAll('#statusBern button').forEach((b) => b.addEventListener('click', () => { estado.statusBern = b.dataset.st; desenhar(); }));
  document.querySelectorAll('details.ajuda').forEach((d) => d.addEventListener('toggle', () => localStorage.setItem('espelho-ajuda-' + d.dataset.ajuda, d.open ? 'aberto' : 'fechado')));
  document.querySelectorAll('#comoEnv button').forEach((b) => b.addEventListener('click', () => { estado.como = b.dataset.como; desenhar(); }));
  const vc = document.getElementById('verCpf');
  if (vc) vc.addEventListener('change', () => { estado.verCpf = vc.checked; desenhar(); });
  const an = document.getElementById('antiga');
  if (an) an.addEventListener('change', async () => {
    const arq = an.value;
    const chave = estado.portal === 'atlas' ? 'antigaAtlas' : 'antigaBern';
    if (!arq) { estado[chave] = null; return desenhar(); }
    try {
      const j = await api(`/api/${estado.portal}/leitura?arq=${encodeURIComponent(arq)}`);
      j._arq = arq;
      estado[chave] = j;
    } catch (e) { alert('Não deu para abrir essa leitura: ' + e.message); }
    desenhar();
  });
}

document.querySelectorAll('#portal button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('#portal button').forEach((x) => x.classList.toggle('on', x === b));
  estado.portal = b.dataset.p; estado.f = {}; estado.ordem = null;
  if (estado[estado.portal]) desenhar(); else carregar();
}));
document.getElementById('atualizar').addEventListener('click', () => carregar(true));
carregar();
</script>
